name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.199.52.99
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/jntugv-pay/htdocs/pay.jntugv.edu.in/
            cd /home/jntugv-pay/htdocs/pay.jntugv.edu.in/
            
            # Check if repo exists, clone if not
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Jntu-Gurajada-Vizianagaram/jntugv_epay .
            else
              echo "Pulling latest changes..."
              git stash
              git pull origin main
            fi
            
            npm run install-all
            npm run build
            
            # Restart backend
            pm2 restart all || echo "PM2 not found or no process to restart"
