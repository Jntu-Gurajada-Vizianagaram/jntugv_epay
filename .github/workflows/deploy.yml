name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Code
        run: |
          cd /home/jntugv-pay/htdocs/pay.jntugv.edu.in/jntugv_epay
          git stash
          git pull origin main
          npm run install-all
          npm run build
          
          # Restart backend
          pm2 restart all || echo "PM2 not found or no process to restart"
